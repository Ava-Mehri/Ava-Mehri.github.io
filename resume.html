<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Your Name</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for modern icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Targeted structural overrides to maximize the PDF view window */
        .profile-container.resume-page-container {
            max-width: 1000px; /* Expands the card width specifically for the resume layout */
        }
        
        .resume-actions {
            margin-bottom: 20px;
        }

        /* Large Fluid PDF Viewer Rule */
        .resume-viewer {
            width: 100%;
            height: 80vh;      /* Dynamically fills 80% of the visible viewport height */
            min-height: 700px; /* Guarantees it won't shrink too small on shorter screens */
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            display: block;
        }

        /* Customized Action Button */
        .btn-download {
            display: inline-flex; 
            align-items: center;
            gap: 8px;
            text-decoration: none; 
            color: #ffffff; 
            background-color: #0073b1; 
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 6px;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-download:hover {
            background-color: #00598a;
        }

        /* Responsive Media Query for Mobile Screens */
        @media (max-width: 600px) {
            /* Completely hides the interactive viewer window on small cellphones */
            .resume-viewer {
                display: none !important;
            }
            
            /* Centers the download button on mobile devices */
            .resume-actions {
                text-align: center;
                margin-top: 30px;
                margin-bottom: 30px;
            }
            
            .btn-download {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <!-- Main Card Container Wrapper -->
    <main class="profile-container resume-page-container">
        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="publications.html">Publications</a>
            <a href="resume.html" class="active">Resume / CV</a>
        </nav>

        <section class="about-me">
            <h1 style="font-size: 1.8rem; margin-top: 0;">Resume / CV</h1>
            <p>Review my full professional experience below, or download a local copy directly to your device.</p>
        </section>
        
        <!-- Primary Action Download Button Line -->
        <div class="resume-actions">
            <a href="assets/Afagh_CV_R.pdf" download class="btn-download">
                <i class="fa-solid fa-file-arrow-down"></i> Download PDF Resume
            </a>
        </div>

        <!-- Enlarged Embedded Interactive PDF Viewer Component -->
        <iframe src="assets/Afagh_CV_R.pdf" class="resume-viewer" type="application/pdf">
            <p>Your web browser does not support embedded PDFs. Please use the button link above to download and open my file.</p>
        </iframe>
    </main>

</body>
</html>
